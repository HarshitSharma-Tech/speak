services:
  # Backend FastAPI Service on Render
  - type: web
    name: learnsync-ai-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: learnsync-postgres
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MOCK_AI_FALLBACK
        value: "true"

databases:
  # Managed PostgreSQL for Render
  - name: learnsync-postgres
    region: oregon
    plan: starter
    databaseName: learnsync
    user: learnsync_user
